services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: connect-hub-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+asyncmy://connect_hub:${MYSQL_PASSWORD}@mysql:3306/connect_hub?charset=utf8mb4
      VAPID_PRIVATE_KEY: /app/vapid_private.pem
      MEILI_URL: http://search:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - /var/lib/connect-hub/data:/data
    ports:
      - "127.0.0.1:5001:5001"
    networks:
      - connect-hub

  mysql:
    image: mysql:8.4
    container_name: connect-hub-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: connect_hub
      MYSQL_USER: connect_hub
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - connect-hub

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: connect-hub-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:80"
    networks:
      - connect-hub

  search:
    image: getmeili/meilisearch:v1.37
    container_name: connect-hub-search
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch_data:/meili_data
    ports:
      - "127.0.0.1:17700:7700"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - connect-hub

networks:
  connect-hub:
    name: connect-hub

volumes:
  meilisearch_data:
    name: connect-hub-meilisearch-data
  mysql_data:
    name: connect-hub-mysql-data
